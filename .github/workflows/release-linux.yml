name: Build (Linux)

# Builds libcanopy_core.so and the canopy tool for Linux, runs the tests, and packages them with
# .github/scripts/package_linux.sh, which refuses a binary that would not start on an older
# distribution. The game and the Canopy loader stay Windows and run through Proton, so this job
# builds no loader. Canopy Studio builds in its own repository. The tarball is a workflow
# artifact; build.yml, release.yml and nightly.yml call this same workflow. Adapted from
# G-Diffuser's release-linux.yml.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version for the package names, without the leading v; empty for the tag or dev-<commit>'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the package names, without the leading v'
        required: true
        default: '0.0.0-test'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # The runner image tracks the newest Ubuntu, and a library built there asks for its glibc.
    # 22.04 pins the floor to something every supported distribution clears, from Steam Deck's
    # SteamOS to rolling ones such as CachyOS and Arch.
    container: ubuntu:22.04

    # In a container a step runs under sh, which is dash on Ubuntu and has no ${GITHUB_SHA::7}.
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Install build tools
        # git has to exist before actions/checkout runs, or checkout falls back to a source
        # download without history.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc-12 g++-12 cmake ninja-build \
            git ca-certificates python3
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          # The commit time pins the tarballs' file times.
          fetch-depth: 1

      - name: Resolve version
        id: version
        # Through the environment rather than inline, so the input cannot be read as shell syntax.
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          value="$REQUESTED_VERSION"
          if [ -z "$value" ] && [ "$GITHUB_REF_TYPE" = tag ]; then value="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$value" ]; then value="dev-${GITHUB_SHA::7}"; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build
        # No vcpkg: MinHook is the loader's, and the loader is Windows only.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCANOPY_RELEASE=$VERSION"
          cmake --build build

      - name: Test CanopyCore
        # The checks that read the game or the private test mods skip themselves here.
        run: ctest --test-dir build --output-on-failure

      - name: Package and verify portability
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          bash .github/scripts/package_linux.sh build "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ steps.version.outputs.value }}
          path: dist/*.tar.gz
          if-no-files-found: error
