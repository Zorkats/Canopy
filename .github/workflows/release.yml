name: Release

# A tag such as v1.2.0 publishes a GitHub release with every package: Canopy, VillageQoL and the
# SDK, Canopy Studio for Windows and Linux, and the Linux tools. Canopy Studio's installer reads
# the latest release and downloads Canopy-<version>.zip and VillageQoL-<version>.zip by those
# names, checked against the SHA-256 GitHub lists for each asset. The builds are the platform
# workflows themselves, called rather than copied, and nothing is published unless both built.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Queued, not cancelled: a cancelled publish could leave the release half made.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/release-windows.yml

  linux:
    uses: ./.github/workflows/release-linux.yml

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    # The only job that can write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${TAG#v}"
          assets=(dist/*.zip dist/*.tar.gz)
          for wanted in "Canopy-$version.zip" "VillageQoL-$version.zip"; do
            if [ ! -f "dist/$wanted" ]; then
              echo "::error::$wanted is missing, and Canopy Studio installs from it."
              exit 1
            fi
          done

          {
            echo "## Downloads"
            echo
            echo "- \`Canopy-$version.zip\`: the loader. Extract into the game folder, next to \`village.exe\`."
            echo "- \`VillageQoL-$version.zip\`: the VillageQoL mod. Extract into the game folder."
            echo "- \`CanopyStudio-$version-windows-x64.zip\` and \`CanopyStudio-$version-linux-x64.tar.gz\`: Canopy Studio, which installs both of the above for you."
            echo "- \`Canopy-SDK-$version.zip\` and \`Canopy-Tools-$version-linux-x64.tar.gz\`: for mod authors."
            echo
            echo "On Linux and Steam Deck the game runs through Proton. Canopy loads only with this Steam launch option:"
            echo
            echo '```'
            echo 'WINEDLLOVERRIDES="dinput8=n,b" %command%'
            echo '```'
          } > notes.md

          gh release create "$TAG" "${assets[@]}" --verify-tag --title "Canopy $version" \
            --notes-file notes.md --generate-notes
