name: Release

# A tag such as v1.2.0 publishes a GitHub release with every package: Canopy, the SDK and the
# Linux tools. Canopy Studio's installer reads the latest release and downloads
# Canopy-<version>.zip by that name, checked against the SHA-256 GitHub lists for it. VillageQoL
# and Canopy Studio are released from their own repositories. The builds are the platform
# workflows themselves, called rather than copied, and nothing is published unless both built.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Queued, not cancelled: a cancelled publish could leave the release half made.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/release-windows.yml

  linux:
    uses: ./.github/workflows/release-linux.yml

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    # The only job that can write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${TAG#v}"
          assets=(dist/*.zip dist/*.tar.gz)
          if [ ! -f "dist/Canopy-$version.zip" ]; then
            echo "::error::Canopy-$version.zip is missing, and Canopy Studio installs from it."
            exit 1
          fi

          {
            echo "## Downloads"
            echo
            echo "- \`Canopy-$version.zip\`: the loader. Extract into the game folder, next to \`village.exe\`."
            echo "- \`Canopy-SDK-$version.zip\` and \`Canopy-Tools-$version-linux-x64.tar.gz\`: for mod authors."
            echo
            echo "[VillageQoL](https://github.com/Zorkats/VillageQoL/releases/latest) and [Canopy Studio](https://github.com/Zorkats/CanopyStudio/releases/latest), which installs Canopy and VillageQoL for you, have their own releases."
            echo
            echo "On Linux and Steam Deck the game runs through Proton. Canopy loads only with this Steam launch option:"
            echo
            echo '```'
            echo 'WINEDLLOVERRIDES="dinput8=n,b" %command%'
            echo '```'
          } > notes.md

          gh release create "$TAG" "${assets[@]}" --verify-tag --title "Canopy $version" \
            --notes-file notes.md --generate-notes

  # Adds the release to the Nexus Mods page as a new version of each file there. Nexus adds
  # versions only to a file that already exists, so each upload waits for its file's ID in the
  # repository variables, set once that file has been uploaded by hand. A failure here leaves the
  # GitHub release as it is.
  nexus:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Read the version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload Canopy
        if: vars.NEXUS_FILE_ID_CANOPY != ''
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID_CANOPY }}
          filename: dist/Canopy-${{ steps.tag.outputs.version }}.zip
          display_name: Canopy
          version: ${{ steps.tag.outputs.version }}
          category: main
          archive_existing_version: true
          update_mod_version: true

      - name: Upload the SDK
        if: vars.NEXUS_FILE_ID_SDK != ''
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID_SDK }}
          filename: dist/Canopy-SDK-${{ steps.tag.outputs.version }}.zip
          display_name: Canopy SDK
          version: ${{ steps.tag.outputs.version }}
          category: optional
          archive_existing_version: true

      - name: Upload the Linux tools
        if: vars.NEXUS_FILE_ID_TOOLS != ''
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID_TOOLS }}
          filename: dist/Canopy-Tools-${{ steps.tag.outputs.version }}-linux-x64.tar.gz
          display_name: Canopy Tools for Linux
          version: ${{ steps.tag.outputs.version }}
          category: optional
          archive_existing_version: true
